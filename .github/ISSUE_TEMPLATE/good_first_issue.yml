name: Good first AgentTrail contribution
description: Small contribution that can help AgentTrail grow.
title: "[Good first issue]: "
labels: ["good first issue", "help wanted"]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping make AgentTrail more useful and more trustworthy."
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Recipe
        - Demo
        - Documentation
        - Security
        - Evaluation
        - Install
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What should be improved?
      placeholder: Add a small recipe pack for students, improve the demo copy, add an eval check...
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: List the acceptance criteria.
    validations:
      required: true
