name: Release Artifacts

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm run test:unit
      - run: npm run test:supply-chain
      - run: npm test
      - run: npm run eval
      - run: npm run release:sbom
      - run: npm run release:homebrew
      - run: mkdir -p dist/npm
      - run: npm pack --json --pack-destination dist/npm
      - run: npm run release:reproducible
      - run: npm run release:checksums
      - run: npm run release:verify-checksums
      - name: Sign checksums or dry-run signing plan
        env:
          AGENTTRAIL_CHECKSUM_SIGNING_PRIVATE_KEY: ${{ secrets.AGENTTRAIL_CHECKSUM_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$AGENTTRAIL_CHECKSUM_SIGNING_PRIVATE_KEY" ]; then
            npm run release:sign-checksums
          else
            npm run release:sign-checksums -- --dry-run
          fi
      - run: npm run package:desktop
      - run: npm run package:mac-app
      - run: npm run package:linux
      - run: npm run sign:mac-app -- --dry-run
      - run: npm run sign:windows -- --dry-run
      - uses: actions/upload-artifact@v7
        with:
          name: agenttrail-release-artifacts
          path: |
            docs/checksums/
            docs/sbom/
            dist/npm/
            dist/reproducible/
            dist/mac/
            Formula/agenttrail.rb
            installers/
            updates/
