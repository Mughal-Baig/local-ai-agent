name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: node --check server.js
      - run: node --check bin/agenttrail-chat.js
      - run: node --check public/app.js
      - run: node --check src/model-adapters.js
      - run: node --check src/tool-schemas.js
      - run: node --check src/document-ingestion.js
      - run: node --check src/audio-transcription.js
      - run: node --check src/image-generation.js
      - run: node --check src/features/redact.js
      - run: node --check src/runtime-hardware.js
      - run: node --check src/runtime-loading.js
      - run: node --check src/model-registry.js
      - run: node --check src/bundled-runtime.js
      - run: node --check scripts/load-test.js
      - run: node --check scripts/benchmark-runtime.js
      - run: node --check tests/fixtures/mock-tts.js
      - run: node --check tests/fixtures/mock-bundled-runtime.js
      - run: node --check scripts/smoke-test.js
      - run: node --check scripts/evaluate-agenttrail.js
      - run: node --check tests/unit/redact.test.js
      - run: node --check tests/unit/runtime-hardware.test.js
      - run: node --check tests/unit/runtime-loading.test.js
      - run: node --check tests/unit/model-registry.test.js
      - run: node --check tests/integration/model-registry.test.js
      - run: node --check tests/integration/openai-compatible-server.test.js
      - run: node --check tests/integration/health.test.js
      - run: node --check tests/integration/concurrency.test.js
      - run: node --check tests/integration/model-options.test.js
      - run: node --check tests/integration/resources.test.js
      - run: node --check tests/integration/bundled-runtime.test.js
      - run: node tests/unit/foundation.test.js
      - run: node tests/unit/runtime-hardware.test.js
      - run: node tests/unit/runtime-loading.test.js
      - run: node tests/unit/model-registry.test.js
      - run: node tests/unit/redact.test.js
      - run: node tests/unit/pdf-extraction.test.js
      - run: node tests/unit/audio-transcription.test.js
      - run: node tests/integration/audio-transcription.test.js
      - run: node tests/unit/image-generation.test.js
      - run: node tests/integration/image-generation.test.js
      - run: node tests/integration/vision-input.test.js
      - run: node tests/unit/search-chunking.test.js
      - run: node tests/unit/rerank.test.js
      - run: node tests/integration/api.test.js
      - run: node tests/integration/openai-backend.test.js
      - run: node tests/integration/openai-compatible-server.test.js
      - run: node tests/integration/model-management.test.js
      - run: node tests/integration/model-registry.test.js
      - run: node tests/integration/embedding-cache.test.js
      - run: node scripts/eval-search.js
      - run: node scripts/benchmark-search.js
      - run: node tests/integration/resumable-run.test.js
      - run: node tests/integration/search-incremental.test.js
      - run: node tests/integration/health.test.js
      - run: node tests/integration/concurrency.test.js
      - run: node tests/integration/model-options.test.js
      - run: node tests/integration/resources.test.js
      - run: node tests/integration/bundled-runtime.test.js
      - run: node tests/integration/native-tool-calling.test.js
      - run: node tests/integration/ollama-native-tools.test.js
      - run: node tests/integration/tool-repair.test.js
      - run: node tests/integration/multi-tool-calls.test.js
      - run: node tests/integration/structured-output.test.js
      - run: node tests/integration/agent-plan.test.js
      - run: node tests/integration/run-guardrails.test.js
      - run: node tests/integration/reflection-loop.test.js
      - run: node tests/integration/memory-structured.test.js
      - run: node tests/integration/memory-suggestions.test.js
      - run: node tests/integration/memory-retrieval.test.js
      - run: node tests/integration/memory-history.test.js
      - run: node tests/integration/memory-scopes.test.js
      - run: node tests/ui/playwright-smoke.test.js
      - run: node scripts/smoke-test.js
      - run: node scripts/evaluate-agenttrail.js
