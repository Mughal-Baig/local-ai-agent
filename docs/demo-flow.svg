<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #f4f7f5; }
    .side { fill: #e7eeeb; }
    .panel { fill: #fff; stroke: #d6ded9; }
    .ink { fill: #1f2430; font-family: Arial, sans-serif; }
    .muted { fill: #6b6f7a; font-family: Arial, sans-serif; }
    .teal { fill: #246b62; }
    .coral { fill: #c35b43; }
    .amber { fill: #d99b2b; }
    .step { opacity: 0.25; }
    #step1 { animation: pulse 8s infinite; }
    #step2 { animation: pulse 8s infinite 2s; }
    #step3 { animation: pulse 8s infinite 4s; }
    #step4 { animation: pulse 8s infinite 6s; }
    @keyframes pulse {
      0%, 20% { opacity: 1; }
      25%, 100% { opacity: 0.25; }
    }
  </style>
  <rect class="bg" width="960" height="540"/>
  <rect class="side" width="300" height="540"/>
  <text class="ink" x="36" y="46" font-size="24" font-weight="700">AgentTrail</text>
  <text class="muted" x="36" y="70" font-size="14">Local agent with search, diffs, receipts</text>

  <g id="step1" class="step">
    <rect class="panel" x="28" y="104" width="244" height="82" rx="8"/>
    <circle class="teal" cx="52" cy="132" r="7"/>
    <text class="ink" x="70" y="137" font-size="16" font-weight="700">Pick a recipe</text>
    <text class="muted" x="70" y="162" font-size="13">Hardening, review, release notes</text>
  </g>

  <g id="step2" class="step">
    <rect class="panel" x="28" y="208" width="244" height="82" rx="8"/>
    <circle class="amber" cx="52" cy="236" r="7"/>
    <text class="ink" x="70" y="241" font-size="16" font-weight="700">Search local context</text>
    <text class="muted" x="70" y="266" font-size="13">Files and receipts stay local</text>
  </g>

  <g id="step3" class="step">
    <rect class="panel" x="28" y="312" width="244" height="82" rx="8"/>
    <circle class="coral" cx="52" cy="340" r="7"/>
    <text class="ink" x="70" y="345" font-size="16" font-weight="700">Preview file writes</text>
    <text class="muted" x="70" y="370" font-size="13">Diffs before touching files</text>
  </g>

  <g id="step4" class="step">
    <rect class="panel" x="28" y="416" width="244" height="82" rx="8"/>
    <circle class="teal" cx="52" cy="444" r="7"/>
    <text class="ink" x="70" y="449" font-size="16" font-weight="700">Export a receipt</text>
    <text class="muted" x="70" y="474" font-size="13">Markdown trail for trust/debugging</text>
  </g>

  <rect class="panel" x="336" y="48" width="564" height="88" rx="8"/>
  <text class="muted" x="364" y="82" font-size="13" font-weight="700">PRIVATE LOCAL ASSISTANT</text>
  <text class="ink" x="364" y="112" font-size="28" font-weight="800">Evaluate before installing</text>

  <rect class="panel" x="336" y="164" width="564" height="236" rx="8"/>
  <text class="ink" x="364" y="204" font-size="18" font-weight="700">What visitors see in 30 seconds</text>
  <text class="muted" x="364" y="238" font-size="15">1. Tiny readable Node agent loop</text>
  <text class="muted" x="364" y="268" font-size="15">2. Workspace search before answers</text>
  <text class="muted" x="364" y="298" font-size="15">3. Workspace-safe tools with visible trail</text>
  <text class="muted" x="364" y="328" font-size="15">4. Diff previews and saved receipts</text>
  <rect x="364" y="352" width="176" height="32" rx="16" fill="#e4f0ed"/>
  <text class="ink" x="386" y="373" font-size="13" font-weight="700">Zero npm dependencies</text>
  <rect x="552" y="352" width="156" height="32" rx="16" fill="#fff4d8"/>
  <text class="ink" x="574" y="373" font-size="13" font-weight="700">Ollama local-first</text>

  <rect class="teal" x="336" y="430" width="190" height="52" rx="8"/>
  <text x="376" y="463" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="800">Run locally</text>
  <rect class="panel" x="544" y="430" width="224" height="52" rx="8"/>
  <text class="ink" x="574" y="463" font-size="16" font-weight="800">Open static demo</text>
</svg>
