<svg width="1280" height="520" viewBox="0 0 1280 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #f4f7f5; }
    .panel { fill: #fff; stroke: #d6ded9; }
    .ink { fill: #1f2430; font-family: Arial, sans-serif; }
    .muted { fill: #6b6f7a; font-family: Arial, sans-serif; }
    .teal { fill: #246b62; }
    .soft { fill: #e4f0ed; }
    .coral { fill: #c35b43; }
    .amber { fill: #d99b2b; }
    .step { animation: pulse 8s infinite; opacity: .35; }
    #s1 { animation-delay: 0s; }
    #s2 { animation-delay: 2s; }
    #s3 { animation-delay: 4s; }
    #s4 { animation-delay: 6s; }
    @keyframes pulse {
      0%, 24% { opacity: 1; transform: translateY(-4px); }
      25%, 100% { opacity: .35; transform: translateY(0); }
    }
  </style>
  <rect class="bg" width="1280" height="520"/>
  <text class="ink" x="48" y="58" font-size="30" font-weight="800">AgentTrail trust loop</text>
  <text class="muted" x="48" y="88" font-size="17">Search local evidence → preview the diff → apply deliberately → export a receipt</text>

  <g id="s1" class="step">
    <rect class="panel" x="48" y="132" width="260" height="250" rx="10"/>
    <circle class="teal" cx="82" cy="170" r="12"/>
    <text class="ink" x="110" y="176" font-size="20" font-weight="800">1. Search</text>
    <rect x="78" y="210" width="200" height="36" rx="8" fill="#f4f7f5" stroke="#d6ded9"/>
    <text class="muted" x="94" y="234" font-size="14">semantic index: receipts</text>
    <rect x="78" y="266" width="200" height="54" rx="8" fill="#e4f0ed"/>
    <text class="ink" x="94" y="289" font-size="13" font-weight="700">welcome.md</text>
    <text class="muted" x="94" y="309" font-size="12">safe diffs and receipts</text>
  </g>

  <g id="s2" class="step">
    <rect class="panel" x="360" y="132" width="260" height="250" rx="10"/>
    <circle class="amber" cx="394" cy="170" r="12"/>
    <text class="ink" x="422" y="176" font-size="20" font-weight="800">2. Preview</text>
    <rect x="390" y="212" width="200" height="116" rx="8" fill="#1f2430"/>
    <text x="406" y="240" fill="#e4f0ed" font-family="Arial, sans-serif" font-size="12">--- a/note.md</text>
    <text x="406" y="262" fill="#e4f0ed" font-family="Arial, sans-serif" font-size="12">+++ b/note.md</text>
    <text x="406" y="284" fill="#8ee0bc" font-family="Arial, sans-serif" font-size="12">+ Evidence cited</text>
    <text x="406" y="306" fill="#8ee0bc" font-family="Arial, sans-serif" font-size="12">+ Receipt saved</text>
  </g>

  <g id="s3" class="step">
    <rect class="panel" x="672" y="132" width="260" height="250" rx="10"/>
    <circle class="coral" cx="706" cy="170" r="12"/>
    <text class="ink" x="734" y="176" font-size="20" font-weight="800">3. Apply</text>
    <rect class="soft" x="702" y="218" width="200" height="72" rx="8"/>
    <text class="ink" x="728" y="248" font-size="16" font-weight="800">User approval</text>
    <rect class="teal" x="746" y="306" width="112" height="42" rx="8"/>
    <text x="782" y="333" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="800">Apply</text>
  </g>

  <g id="s4" class="step">
    <rect class="panel" x="984" y="132" width="248" height="250" rx="10"/>
    <circle class="teal" cx="1018" cy="170" r="12"/>
    <text class="ink" x="1046" y="176" font-size="20" font-weight="800">4. Receipt</text>
    <rect x="1014" y="214" width="188" height="118" rx="8" fill="#fff4d8"/>
    <text class="ink" x="1030" y="242" font-size="13" font-weight="800">Trust Score: 88</text>
    <text class="muted" x="1030" y="266" font-size="12">search_workspace</text>
    <text class="muted" x="1030" y="288" font-size="12">preview_write_file</text>
    <text class="muted" x="1030" y="310" font-size="12">saved report.html</text>
  </g>

  <rect class="teal" x="48" y="430" width="240" height="52" rx="8"/>
  <text x="83" y="463" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="800">Clone and run locally</text>
  <rect class="panel" x="306" y="430" width="260" height="52" rx="8"/>
  <text class="ink" x="336" y="463" font-size="16" font-weight="800">Open the live demo first</text>
</svg>
